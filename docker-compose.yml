services:
  postgres:
    image: postgres:16
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once, in alphabetical order, on an empty data directory.
      # Mounted individually so the entrypoint does not try to execute the
      # portfolio's README.md and diagram files.
      - ./portfolio-1-database-design/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./portfolio-1-database-design/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: portfolio
      MONGO_INITDB_ROOT_PASSWORD: portfolio
      MONGO_INITDB_DATABASE: hospital_labs
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      # Uncomment once mongodb-setup.js is written:
      # - ./portfolio-4-nosql/mongodb-setup.js:/docker-entrypoint-initdb.d/01-setup.js:ro

volumes:
  pgdata:
  mongodata:
