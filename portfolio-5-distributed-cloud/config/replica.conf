# Portfolio 5 - hot-standby replica settings
#
# pg_basebackup -R writes primary_conninfo and standby.signal automatically.
# The connection string below is the sanitized equivalent of what is written to
# postgresql.auto.conf on the replica; the password is a disposable demo
# credential and must be replaced by a secret/passfile in a real deployment.

hot_standby = on
primary_conninfo = 'host=portfolio-p5-primary port=5432 user=replicator password=replpass application_name=portfolio-p5-replica'
recovery_target_timeline = 'latest'

# The replica is read-only while it is in recovery. Promotion clears
# standby.signal and ends recovery; see the failover step.
