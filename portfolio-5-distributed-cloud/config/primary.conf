# Portfolio 5 - primary settings
#
# These are the settings the primary is started with in replication-setup.ps1.
# They are kept here as a committed fragment so the deployment can be reviewed
# without reading the PowerShell argument list.
#
# Docker applies the non-default values with `-c key=value`; the same lines can
# be appended to postgresql.conf for a non-container deployment.

wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB
hot_standby = on
synchronous_commit = on
track_commit_timestamp = on

# No archive: this exercise demonstrates streaming replication, not PITR.
# See architecture.md section 8 for the backup/restore limitation this creates.
archive_mode = off

# Synchronous replication is off by default. It is enabled only for the
# comparison in `replication-setup.ps1 sync`:
#
# synchronous_standby_names = 'ANY 1 ("portfolio-p5-replica")'
#
# `synchronous_commit = on` alone is a local durability setting; the standby
# acknowledgement is controlled by synchronous_standby_names.
