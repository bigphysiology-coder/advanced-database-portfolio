# Portfolio 5 - replication authentication
#
# Appended to the primary's pg_hba.conf by replication-setup.ps1.
# The P5 containers publish no host ports; this rule is reachable only from
# containers attached to the isolated `portfolio-p5-repl` Docker network.
#
# TYPE  DATABASE     USER         ADDRESS       METHOD
host    replication  replicator   0.0.0.0/0     scram-sha-256
